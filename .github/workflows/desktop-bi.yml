name: Verify desktop BI workbooks
on:
  workflow_dispatch:
    inputs:
      include_tableau:
        description: Also verify Tableau when its official installer is accessible
        type: boolean
        default: false
  push:
    branches: [main, codex/production-acceptance]
    paths:
      - server/bi-exports.ts
      - server/tableau-exports.ts
      - scripts/prepare-bi-desktop.ts
      - scripts/native-fixture.mjs
      - server/analytics.ts
      - server/seed.ts
      - shared/analytics.ts
      - scripts/*bi-desktop*
      - scripts/desktop-bi-tools.json
      - scripts/desktop-bi-model/**
      - tests/fixtures/analytics-report.ts
      - .github/workflows/desktop-bi.yml
permissions:
  contents: read
concurrency:
  group: desktop-bi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.platform }} desktop acceptance
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_tableau && '["power-bi", "tableau"]' || '["power-bi"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        if: matrix.platform == 'power-bi'
        with:
          dotnet-version: "8.0.x"
      - name: Build the Microsoft ADOMD model verifier
        if: matrix.platform == 'power-bi'
        run: dotnet build scripts/desktop-bi-model/PartnerHub.DesktopModel.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Prepare synthetic offline workbooks
        run: node --import tsx scripts/prepare-bi-desktop.ts
      - uses: actions/cache/restore@v4
        id: installer-cache
        with:
          path: ${{ runner.temp }}/partnerhub-${{ matrix.platform }}-setup.exe
          key: desktop-${{ matrix.platform }}-${{ hashFiles('scripts/desktop-bi-tools.json') }}
      - name: Install and open the official desktop application
        id: desktop
        shell: powershell
        run: ./scripts/verify-bi-desktop.ps1 -Platform '${{ matrix.platform }}'
      - name: Capture the actual business dashboards with labelled illustrative data
        if: always() && matrix.platform == 'power-bi' && steps.desktop.outputs.desktop_installed == 'true'
        shell: powershell
        run: ./scripts/verify-bi-desktop.ps1 -Platform power-bi -Snapshot presentation
      - uses: actions/cache/save@v4
        if: always() && steps.desktop.outputs.installer_verified == 'true' && steps.installer-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/partnerhub-${{ matrix.platform }}-setup.exe
          key: desktop-${{ matrix.platform }}-${{ hashFiles('scripts/desktop-bi-tools.json') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partnerhub-desktop-${{ matrix.platform }}
          path: artifacts/desktop-bi/
          retention-days: 14
