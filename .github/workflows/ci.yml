name: Verify PartnerHub
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: partnerhub
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: partnerhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partnerhub -d partnerhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: SQLite integration tests
        run: npm test -- --reporter=json --outputFile=artifacts/local-verification/backend-sqlite.json
      - name: PostgreSQL integration tests
        run: npm test -- --reporter=json --outputFile=artifacts/local-verification/backend-postgres.json
        env:
          TEST_DATABASE_URL: postgresql://partnerhub:test-only-password@127.0.0.1:5432/partnerhub_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:files
      - run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the independent Tableau document parser
        run: python -m pip install -r scripts/tableau-validation-requirements.txt
      - name: Verify Tableau packages from fixtures and authenticated browser exports
        run: python scripts/verify-tableau.py artifacts/tableau-verification/test-workbook.twbx artifacts/analytics-verification/VS-PartnerHub-Tableau.twbx
      - run: npm run test:production
      - name: Real-mode authentication through SMTP
        run: npm run test:auth-smtp
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            artifacts/local-verification/
            artifacts/tableau-verification/
            artifacts/analytics-verification/*Tableau*
          retention-days: 7
