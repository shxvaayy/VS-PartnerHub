name: Verify PartnerHub
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: partnerhub
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: partnerhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partnerhub -d partnerhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: SQLite integration tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://partnerhub:test-only-password@127.0.0.1:5432/partnerhub_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
