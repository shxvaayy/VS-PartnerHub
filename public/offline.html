<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e32" />
    <title>Reconnect · VS PartnerHub</title>
    <style>
      body {
        margin: 0;
        background: #f3f6ef;
        color: #29452f;
        font:
          16px/1.8 system-ui,
          sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      main {
        max-width: 420px;
        margin: 24px;
        padding: 38px;
        border: 1px solid #dbe5d3;
        border-radius: 18px;
        background: white;
        text-align: center;
      }
      img {
        width: 65px;
        border-radius: 14px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
        margin: 22px 0 16px;
      }
      p {
        font-size: 14px;
        color: #52694b;
      }
      a {
        display: inline-block;
        background: #284c35;
        color: white;
        border-radius: 8px;
        padding: 10px 20px;
        margin-top: 20px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        data-workspace-logo
        src="/icons/partnerhub-192.png"
        alt="VS PartnerHub"
      />
      <h1>Let’s get you reconnected.</h1>
      <p>
        PartnerHub needs a connection to load your workspace and save business
        records. Check your internet connection, then try again.
      </p>
      <a data-workspace-link href="/app">Return to workspace</a>
    </main>
  </body>
</html>
